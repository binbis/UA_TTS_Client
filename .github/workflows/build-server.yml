name: Build TTS server

on:
  # Manual runs from the Actions tab. The result is two downloadable
  # artifacts (UA_TTS_Server-linux-x86_64, UA_TTS_Server-windows-x64)
  # on the workflow run page. No release is created.
  workflow_dispatch:

jobs:
  linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging/UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: cp -r voices dictionary.json dist/UA_TTS_Server/

      - name: Smoke test (imports, no model)
        run: ./dist/UA_TTS_Server/UA_TTS_Server --check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-linux-x86_64
          # Upload the folder itself, not a zip: a zipped artifact would
          # be wrapped in another zip (double archive) on download.
          path: Server_py/dist/UA_TTS_Server
          if-no-files-found: error

  windows:
    name: Server (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging\UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: Copy-Item -Recurse voices, dictionary.json dist\UA_TTS_Server\

      - name: Smoke test (imports, no model)
        run: .\dist\UA_TTS_Server\UA_TTS_Server.exe --check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-windows-x64
          # Upload the folder itself, not a zip (see the Linux job).
          path: Server_py/dist/UA_TTS_Server
          if-no-files-found: error


