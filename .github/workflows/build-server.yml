name: Build TTS server

on:
  # Manual runs from the Actions tab.
  workflow_dispatch:
  push:
    # Tags additionally attach the zips to a GitHub Release (see the release job).
    tags:
      - "server-v*"

permissions:
  contents: write

jobs:
  linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging/UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: cp -r voices dictionary.json dist/UA_TTS_Server/

      - name: Smoke test (imports, no model)
        run: ./dist/UA_TTS_Server/UA_TTS_Server --check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-linux-x86_64
          # Upload the folder itself, not a zip: a zipped artifact would
          # be wrapped in another zip (double archive) on download.
          path: Server_py/dist/UA_TTS_Server
          if-no-files-found: error

  windows:
    name: Server (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging\UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: Copy-Item -Recurse voices, dictionary.json dist\UA_TTS_Server\

      - name: Smoke test (imports, no model)
        run: .\dist\UA_TTS_Server\UA_TTS_Server.exe --check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-windows-x64
          # Upload the folder itself, not a zip (see the Linux job).
          path: Server_py/dist/UA_TTS_Server
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/server-v')
    steps:
      - name: Download server packages
        uses: actions/download-artifact@v8
        with:
          name: UA_TTS_Server-linux-x86_64
          path: pkg-linux

      - name: Download server packages (Windows)
        uses: actions/download-artifact@v8
        with:
          name: UA_TTS_Server-windows-x64
          path: pkg-win

      - name: Zip the packages for the release
        run: |
          (cd pkg-linux && zip -qr ../UA_TTS_Server-linux-x86_64.zip UA_TTS_Server)
          (cd pkg-win && zip -qr ../UA_TTS_Server-windows-x64.zip UA_TTS_Server)
          ls -la *.zip

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            UA_TTS_Server-linux-x86_64.zip
            UA_TTS_Server-windows-x64.zip
