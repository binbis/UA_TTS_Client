name: Build TTS server

on:
  # Manual runs from the Actions tab.
  workflow_dispatch:
  push:
    # Tags additionally attach the zips to a GitHub Release (see the release job).
    tags:
      - "server-v*"

permissions:
  contents: write

jobs:
  linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging/UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: cp -r voices dictionary.json dist/UA_TTS_Server/

      - name: Smoke test (imports, no model)
        run: ./dist/UA_TTS_Server/UA_TTS_Server --check

      - name: Zip the package
        run: |
          cd dist
          zip -r ../UA_TTS_Server-linux-x86_64.zip UA_TTS_Server
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-linux-x86_64
          # The zip step runs with working-directory Server_py, so the zip
          # is created there. upload-artifact does not inherit that
          # working-directory and looks from the repo root by default.
          path: Server_py/UA_TTS_Server-linux-x86_64.zip
          if-no-files-found: error

  windows:
    name: Server (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Server_py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Server_py/requirements.txt

      - name: Install Torch (CUDA)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Install server dependencies
        run: python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Build server package
        run: pyinstaller packaging\UA_TTS_Server.spec

      - name: Add user data next to the executable
        run: Copy-Item -Recurse voices, dictionary.json dist\UA_TTS_Server\

      - name: Smoke test (imports, no model)
        run: .\dist\UA_TTS_Server\UA_TTS_Server.exe --check

      - name: Zip the package
        run: Compress-Archive -Path dist\UA_TTS_Server -DestinationPath UA_TTS_Server-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UA_TTS_Server-windows-x64
          # See the Linux job: the zip is created inside Server_py/.
          path: Server_py/UA_TTS_Server-windows-x64.zip
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/server-v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            UA_TTS_Server-linux-x86_64.zip
            UA_TTS_Server-windows-x64.zip
